# Dependabot keeps AgentDeck's dependencies and CI actions current.
# The pnpm workspace is covered by the "npm" ecosystem (pnpm lockfiles supported).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
