name: Feature request
description: Suggest an idea for AgentDeck
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what workaround (if any) do you use today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Concrete CLI/UX examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: roadmap
    attributes:
      label: Prior art check
      description: ROADMAP.md may already track this idea.
      options:
        - label: I checked [ROADMAP.md](../../blob/main/ROADMAP.md) and open issues for existing plans
          required: false
